<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GenoMorph — Prologue Cutscene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#d9a441; --amber-dim:#8a6a2c;
    --acid:#9fe870; --acid-dim:#4f7a34;
    --coral:#e2593b; --coral-dim:#7a2f1f;
    --teal:#3e9c93; --teal-dim:#20524c;
    --ink:#eef3ea; --ink-dim:#b9c4b2;
    --void:#070a08;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#050604;font-family:'Inter',sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:24px 12px 40px;}

  .stage-wrap{width:100%;max-width:920px;}
  .screen{
    position:relative;width:100%;aspect-ratio:16/9;background:var(--void);
    border-radius:6px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);
  }
  .bar{position:absolute;left:0;right:0;height:9%;background:#000;z-index:30;}
  .bar.top{top:0;} .bar.bottom{bottom:0;}

  .bg{position:absolute;inset:0;transition:background 1.1s ease;}
  .bg::before{content:"";position:absolute;inset:-20%;opacity:.55;transition:opacity 1s ease, transform 6s ease;
    background:radial-gradient(circle at 30% 30%, var(--glow1,transparent), transparent 60%),
               radial-gradient(circle at 75% 70%, var(--glow2,transparent), transparent 55%);
    animation:drift 14s ease-in-out infinite alternate;}
  @keyframes drift{ from{transform:translate(-2%,-1%) scale(1);} to{transform:translate(2%,2%) scale(1.06);} }

  .vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px rgba(0,0,0,.65);pointer-events:none;z-index:20;}
  .grain{position:absolute;inset:0;pointer-events:none;z-index:21;opacity:.05;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px, transparent 1px 3px);}

  .static-overlay{position:absolute;inset:0;z-index:22;opacity:0;pointer-events:none;transition:opacity .2s;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.08) 0 2px, transparent 2px 4px);
    mix-blend-mode:overlay;}
  .static-overlay.active{opacity:1;animation:staticflick .12s steps(2) infinite;}
  @keyframes staticflick{ 0%{opacity:.6;} 50%{opacity:.9;} 100%{opacity:.5;} }

  .flash{position:absolute;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none;}
  .flash.on{animation:flashpulse 1.4s ease;}
  @keyframes flashpulse{ 0%{opacity:0;} 8%{opacity:.95;} 22%{opacity:.15;} 40%{opacity:.7;} 60%{opacity:.05;} 100%{opacity:0;} }

  .sparks{position:absolute;inset:0;z-index:24;pointer-events:none;}
  .spark{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle, #fff8dd 0%, var(--amber) 45%, transparent 75%);
    opacity:0;}
  .spark.go{animation:shoot 1.6s ease-out forwards;}
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) scale(.4);}
    10%{opacity:1;}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4);}
  }

  .frame-num{position:absolute;top:11%;left:4%;z-index:26;font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.55);}
  .frame-num.rec::before{content:"● REC  ";color:var(--coral);}

  .textzone{position:absolute;left:0;right:0;bottom:12%;z-index:27;padding:0 8% 0 8%;text-align:center;}
  .speaker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--acid);margin-bottom:8px;opacity:0;transition:opacity .4s;}
  .speaker.show{opacity:.85;}
  .line{font-family:'Fraunces',serif;font-weight:400;font-style:italic;font-size:clamp(15px,2.6vw,26px);
    line-height:1.45;color:var(--ink);text-shadow:0 2px 18px rgba(0,0,0,.7);min-height:1.4em;}
  .line.mono{font-family:'JetBrains Mono',monospace;font-style:normal;font-size:clamp(12px,1.9vw,17px);letter-spacing:.02em;}
  .cursor{display:inline-block;width:.5em;opacity:.8;animation:blink 1s steps(1) infinite;}
  @keyframes blink{ 50%{opacity:0;} }

  .direction{position:absolute;top:11%;right:4%;z-index:26;font-family:'JetBrains Mono',monospace;
    font-size:10px;color:rgba(255,255,255,.4);text-align:right;max-width:40%;line-height:1.5;letter-spacing:.03em;}

  .logo-wrap{position:absolute;inset:0;z-index:28;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;transform:scale(.9);transition:opacity 1s ease, transform 1.4s ease;}
  .logo-wrap.show{opacity:1;transform:scale(1);}
  .logo-title{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(30px,6vw,58px);letter-spacing:.03em;color:var(--acid);}
  .logo-tag{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--ink-dim);margin-top:10px;}

  .hud{position:absolute;inset:0;z-index:26;opacity:0;transition:opacity .6s;}
  .hud.show{opacity:1;}
  .hud-top{position:absolute;top:13%;left:5%;right:5%;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acid);letter-spacing:.05em;}
  .hud-pill{border:1px solid rgba(159,232,112,.5);padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.35);}
  .hud-key{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--void);background:var(--acid);padding:6px 14px;border-radius:5px;letter-spacing:.05em;font-weight:700;
    box-shadow:0 0 18px rgba(159,232,112,.5);}

  .frog-eye{position:absolute;z-index:23;border-radius:50%;background:radial-gradient(circle at 35% 35%, #dfffbf, #2f5a1f 70%, #10230b);
    box-shadow:0 0 0 2px rgba(0,0,0,.4) inset;}

  /* controls */
  .controls{width:100%;max-width:920px;margin-top:14px;display:flex;align-items:center;gap:14px;}
  .ctrl-btn{background:#14170f;border:1px solid #2b3122;color:var(--ink);width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s;}
  .ctrl-btn:hover{background:#1c2016;border-color:var(--acid-dim);}
  .ctrl-btn svg{width:15px;height:15px;fill:var(--ink);}
  .progress-track{flex:1;height:4px;background:#20241a;border-radius:3px;position:relative;overflow:hidden;cursor:pointer;}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;background:var(--acid);width:0%;transition:width .05s linear;}
  .chapter-dot{position:absolute;top:-3px;width:2px;height:10px;background:rgba(255,255,255,.25);}
  .scene-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);white-space:nowrap;min-width:64px;text-align:right;}

  .caption-hint{max-width:920px;width:100%;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:#5c6555;text-align:center;letter-spacing:.03em;}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="screen" id="screen">
    <div class="bg" id="bg"></div>
    <div class="static-overlay" id="staticOverlay"></div>
    <div class="sparks" id="sparks"></div>
    <div class="flash" id="flash"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="frame-num" id="frameNum"></div>
    <div class="direction" id="direction"></div>
    <div class="hud" id="hud">
      <div class="hud-top">
        <div class="hud-pill" id="hudLeft">FORM: FROG</div>
        <div class="hud-pill" id="hudRight">BIOSCAN: NOMINAL</div>
      </div>
      <div class="hud-key" id="hudKey">SPACEBAR — LEAP</div>
    </div>
    <div class="logo-wrap" id="logoWrap">
      <div class="logo-title">🌿 GENOMORPH</div>
      <div class="logo-tag">Transform and Thrive. Keep the Wild Alive.</div>
    </div>
    <div class="textzone">
      <div class="speaker" id="speaker"></div>
      <div class="line" id="line"></div>
    </div>
    <div class="bar top"></div>
    <div class="bar bottom"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="restartBtn" title="Restart" aria-label="Restart">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
    </button>
    <button class="ctrl-btn" id="prevBtn" title="Previous scene" aria-label="Previous scene">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn" id="playBtn" title="Play / Pause" aria-label="Play or pause">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" title="Next scene" aria-label="Next scene">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="scene-label" id="sceneLabel">01 / 24</div>
  </div>
  <div class="caption-hint">click the progress bar to jump — space to play/pause</div>
</div>

<script>
const scenes = [
{mood:'archival', label:'ARCHIVAL FOOTAGE', speaker:'DR. STERLING (V.O.)',
 text:'"There is a word ecologists use: keystone. A species whose presence keeps the balance, whose absence causes collapse."',
 dir:'Amber, golden-hour images. Herons in still water. A frog on a lily pad. A hornbill calling.', rec:true},
{mood:'degraded', label:'ARCHIVAL FOOTAGE — CONT.', speaker:'DR. STERLING (V.O.)',
 text:'"This region lost most of its keystones. Not at once. Quietly, over decades — the way a wall loses its mortar."',
 dir:'Same places, degraded. Brown water. Dead trees. Concrete through forest. Bleached reef.', rec:true},
{mood:'lab', label:'INTERIOR — LAB — NIGHT', speaker:'DR. STERLING',
 text:'"My name is Dr. Alistair Sterling. I am a geneticist and biomedical engineer. I\'ve spent eleven years building something I have to believe can help."',
 dir:'Sterling at a workbench, monitors and biological equipment around him. He looks tired.'},
{mood:'lab', label:'INTERIOR — LAB — NIGHT', speaker:'DR. STERLING',
 text:'"The ecosystem already knows how to fix itself. I just need to give it a way back in."',
 dir:'He holds up a panel of the adaptive armor layer.'},
{mood:'lab', label:'MONTAGE — SUIT ASSEMBLY', speaker:'',
 text:'Time-lapse: the GenoMorph suit built, tested, refined. A suited figure flickers between human silhouette and frog outline.',
 dir:'Sterling watches data streams, writes notes, discards designs, starts over.'},
{mood:'degraded', label:'EXTERIOR — WETLANDS BORDER — DAY', speaker:'',
 text:'The Volunteer stands at a wire fence, overlooking the ruined, brown wetlands. Quiet grief hardens into resolve.',
 dir:'Seen from behind. They fold Sterling\'s recruitment listing and turn from the dead water.'},
{mood:'lab', label:'EXTERIOR — LAB ENTRANCE — DAY', speaker:'DR. STERLING (V.O.)',
 text:'"I found the right person. Someone who knew this land. Someone who wanted it back."',
 dir:'The Volunteer arrives. A brief, firm handshake with Sterling at the door.'},
{mood:'lab', label:'INTERIOR — LAB — LATER', speaker:'DR. STERLING',
 text:'"There is something else I need to tell you. About why it\'s you specifically."',
 dir:'The suit hangs in its storage frame. Sterling pulls up a genomic display — two DNA profiles side by side.'},
{mood:'lab', label:'INTERIOR — LAB — LATER', speaker:'DR. STERLING',
 text:'"I tested myself first, years ago. My genome doesn\'t carry it. The suit would tear my mind apart speaking a language it has forgotten how to hear."',
 dir:'Close on the second profile, labeled simply: AS.'},
{mood:'lab', label:'INTERIOR — LAB — LATER', speaker:'DR. STERLING',
 text:'"You were the only applicant who matched. The suit was always going to need you. I just needed to find you."',
 dir:'The Volunteer looks at the suit for a long moment, then back at Sterling.'},
{mood:'lab', label:'INTERIOR — LAB — LATER', speaker:'VOLUNTEER',
 text:'"When do we start?"', dir:'A beat of quiet resolve.'},
{mood:'dawn', label:'EXTERIOR — WETLAND EDGE — DAWN', speaker:'DR. STERLING',
 text:'"Tomorrow morning. Test run only. Sixty seconds in Frog form, then we debrief."',
 dir:'The Volunteer, now suited, stands at the wetland\'s edge. Dark panels glow faintly green.'},
{mood:'dawn', label:'EXTERIOR — WETLAND EDGE — DAWN', speaker:'DR. STERLING (RADIO)',
 text:'"BioScan readings coming in. Contamination higher than expected — but within tolerance. Initiating Frog transformation on your mark."',
 dir:'Radio crackle over the earpiece.'},
{mood:'dawn', label:'EXTERIOR — WETLAND EDGE — DAWN', speaker:'VOLUNTEER',
 text:'"Mark."', dir:'The suit shimmers. Silhouette shifts smoothly into the shape of a native frog.'},
{mood:'surge', label:'THE SURGE', speaker:'',
 text:'A blinding burst of white light. A violent electrical crackle. Twelve pulses of golden light erupt outward — the DNA database, scattering. Gone.',
 dir:'SLOW MOTION. A warning klaxon sounds briefly, then dies.', effect:'surge'},
{mood:'swamp', label:'FROG-EYE VIEW', speaker:'',
 text:'The world drops to frog-height. Reeds tower like redwoods. Sludge drops the size of boulders. Breath comes shallow — the breathing of a small, panicked animal.',
 dir:'Webbed hands press into the mud. Center of gravity too low — a wobble, a tumble onto their side.', effect:'frogeye'},
{mood:'swamp', label:'THE DEEP MARSH', speaker:'',
 text:'Silence, save for a wet throat pulsing. Then — a distant, water-muffled roar. Something massive, waking. The sound vibrates through the mud.',
 dir:'Nothing visible yet. Only sound.'},
{mood:'radio', label:'RADIO — HAYWIRE', speaker:'DR. STERLING (RADIO)',
 text:'"Volunteer! Volunteer, do you copy? The biometric stream is haywire — please respond!"',
 dir:'Heavy static. Genuine panic in his voice.', effect:'static'},
{mood:'swamp', label:'FROG-EYE VIEW', speaker:'VOLUNTEER',
 text:'"I\'m here. I\'m... I\'m down in the mud. Sterling, I\'m a frog. I\'m literally a frog."',
 dir:'High-pitched, trembling voice. They look down at webbed limbs.'},
{mood:'radio', label:'RADIO', speaker:'DR. STERLING (RADIO)',
 text:'"The DSEE discharged. All twelve genomes — gone from the suit. Released as raw biological energy. Whatever is living in that wetland right now — I don\'t know what it is anymore."',
 dir:'Frantic keystrokes through the static.', effect:'static'},
{mood:'radio', label:'RADIO', speaker:'VOLUNTEER / DR. STERLING',
 text:'"What do I do?" — "...The data is still out there. Your suit\'s Purification Module is still active. Go carefully, Volunteer. Whatever is out there — it isn\'t ordinary anymore."',
 dir:'A long pause before Sterling answers, quieter than before.', effect:'static'},
{mood:'title', label:'', speaker:'', text:'', dir:'', effect:'title'},
{mood:'swamp', label:'GAMEPLAY BEGINS', speaker:'DR. STERLING (RADIO)',
 text:'"Okay... suit telemetry is stable. Your basic systems are functioning. You need to get moving, Volunteer — something big is heading toward your signature."',
 dir:'A chemical-laced droplet falls from a giant reed. HUD flashes: SPACEBAR to Leap.', effect:'hud'},
{mood:'swamp', label:'PLAYER GAINS CONTROL', speaker:'',
 text:'The player leaps just in time. An invasive mosquito flies close — a tongue snaps out, catching it, healing minor armor damage.',
 dir:'HUD flashes: MOUSE 1 to Feed. Control passes to the player.', effect:'hud2'},
];

const moods = {
  archival:  {a:'radial-gradient(circle,#3a2c10,transparent)', b:'radial-gradient(circle,#20180a,transparent)', base:'linear-gradient(180deg,#1c1508,#0c0904)'},
  degraded:  {a:'radial-gradient(circle,#2a2618,transparent)', b:'radial-gradient(circle,#141610,transparent)', base:'linear-gradient(180deg,#181a12,#0a0b08)'},
  lab:       {a:'radial-gradient(circle,#123430,transparent)', b:'radial-gradient(circle,#0a1d22,transparent)', base:'linear-gradient(180deg,#08131a,#040808)'},
  dawn:      {a:'radial-gradient(circle,#2c4a3d,transparent)', b:'radial-gradient(circle,#4a3a2a,transparent)', base:'linear-gradient(180deg,#122a24,#070a06)'},
  surge:     {a:'radial-gradient(circle,#8a6a1a,transparent)', b:'radial-gradient(circle,#5a3010,transparent)', base:'linear-gradient(180deg,#221a06,#0a0603)'},
  swamp:     {a:'radial-gradient(circle,#1c2c10,transparent)', b:'radial-gradient(circle,#0e1808,transparent)', base:'linear-gradient(180deg,#0e1408,#050704)'},
  radio:     {a:'radial-gradient(circle,#123030,transparent)', b:'radial-gradient(circle,#0a1414,transparent)', base:'linear-gradient(180deg,#0a1212,#040606)'},
  title:     {a:'radial-gradient(circle,#16240e,transparent)', b:'radial-gradient(circle,#0a1206,transparent)', base:'linear-gradient(180deg,#0a0e08,#020302)'},
};

const bg = document.getElementById('bg');
const speakerEl = document.getElementById('speaker');
const lineEl = document.getElementById('line');
const directionEl = document.getElementById('direction');
const frameNumEl = document.getElementById('frameNum');
const staticOverlay = document.getElementById('staticOverlay');
const flashEl = document.getElementById('flash');
const sparksEl = document.getElementById('sparks');
const logoWrap = document.getElementById('logoWrap');
const hudEl = document.getElementById('hud');
const progressFill = document.getElementById('progressFill');
const progressTrack = document.getElementById('progressTrack');
const sceneLabel = document.getElementById('sceneLabel');
const playIcon = document.getElementById('playIcon');

let idx = 0, playing = true, typeTimer = null, advanceTimer = null, progInterval = null;
const HOLD_AFTER_TYPE = 1400;
const MS_PER_CHAR = 26;

function clearTimers(){
  clearTimeout(typeTimer); clearTimeout(advanceTimer); clearInterval(progInterval);
}

function renderChapterDots(){
  scenes.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='chapter-dot';
    d.style.left=(i/scenes.length*100)+'%';
    progressTrack.appendChild(d);
  });
}

function setScene(i, resume){
  idx = ((i % scenes.length) + scenes.length) % scenes.length;
  const s = scenes[idx];
  clearTimers();
  sceneLabel.textContent = String(idx+1).padStart(2,'0') + ' / ' + scenes.length;

  const m = moods[s.mood];
  bg.style.setProperty('--glow1', m.a);
  bg.style.setProperty('--glow2', m.b);
  bg.style.background = m.base;

  frameNumEl.textContent = s.label || '';
  frameNumEl.classList.toggle('rec', !!s.rec);
  directionEl.textContent = s.dir || '';

  staticOverlay.classList.toggle('active', s.effect==='static');
  logoWrap.classList.toggle('show', s.effect==='title');
  hudEl.classList.toggle('show', s.effect==='hud' || s.effect==='hud2');

  document.getElementById('hudKey').textContent = s.effect==='hud2' ? 'MOUSE 1 — FEED' : 'SPACEBAR — LEAP';

  flashEl.classList.remove('on');
  sparksEl.innerHTML='';
  if(s.effect==='surge'){
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
    for(let k=0;k<12;k++){
      const sp=document.createElement('div');
      sp.className='spark';
      const ang = (k/12)*Math.PI*2;
      const dist = 140+Math.random()*90;
      sp.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      sp.style.setProperty('--dy', Math.sin(ang)*dist+'px');
      sp.style.animationDelay = (k*40)+'ms';
      sparksEl.appendChild(sp);
      requestAnimationFrame(()=>sp.classList.add('go'));
    }
  }

  speakerEl.textContent = s.speaker || '';
  speakerEl.classList.toggle('show', !!s.speaker);
  lineEl.classList.toggle('mono', s.mood==='radio');
  lineEl.innerHTML = '';

  typewrite(s.text || '', s);
  runProgress(s);
}

function typewrite(text, s){
  let charIdx = 0;
  lineEl.innerHTML = '<span id="typed"></span><span class="cursor">|</span>';
  const typedEl = document.getElementById('typed');
  const totalMs = Math.min(text.length * MS_PER_CHAR, 3800);
  const stepMs = text.length ? totalMs/text.length : 0;
  function step(){
    if(!playing) return;
    charIdx++;
    typedEl.textContent = text.slice(0,charIdx);
    if(charIdx < text.length){
      typeTimer = setTimeout(step, stepMs);
    } else {
      const cur = lineEl.querySelector('.cursor');
      if(cur) cur.style.display='none';
      if(playing){
        advanceTimer = setTimeout(()=>{ if(playing) setScene(idx+1); }, s.effect==='title'?2600:HOLD_AFTER_TYPE);
      }
    }
  }
  if(text.length===0){
    if(playing){
      advanceTimer = setTimeout(()=>{ if(playing) setScene(idx+1); }, s.effect==='title'?2600:1600);
    }
    return;
  }
  step();
}

function runProgress(s){
  const dur = 3800 + (s.effect==='title'?2600:HOLD_AFTER_TYPE);
  const start = performance.now();
  progInterval = setInterval(()=>{
    const t = Math.min((performance.now()-start)/dur, 1);
    progressFill.style.width = ((idx + t)/scenes.length*100)+'%';
    if(t>=1) clearInterval(progInterval);
  }, 60);
}

function togglePlay(force){
  playing = force !== undefined ? force : !playing;
  playIcon.innerHTML = playing
    ? '<path d="M8 5v14l11-7z"/>'
    : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  if(playing){ setScene(idx); }
  else{ clearTimers(); }
}

document.getElementById('playBtn').onclick = ()=>togglePlay();
document.getElementById('nextBtn').onclick = ()=>{ togglePlay(true); setScene(idx+1); };
document.getElementById('prevBtn').onclick = ()=>{ togglePlay(true); setScene(idx-1); };
document.getElementById('restartBtn').onclick = ()=>{ togglePlay(true); setScene(0); };
progressTrack.onclick = (e)=>{
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX-rect.left)/rect.width;
  togglePlay(true);
  setScene(Math.floor(pct*scenes.length));
};
document.addEventListener('keydown', (e)=>{
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowRight'){ togglePlay(true); setScene(idx+1); }
  if(e.code==='ArrowLeft'){ togglePlay(true); setScene(idx-1); }
});

renderChapterDots();
setScene(0);
</script>
</body>
</html>
